<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111827">
  <meta name="description" content="A new experience is on its way. Work in progress.">
  <title>Something Good Is Coming</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #090d1b;
      --text: #f8fafc;
      --muted: #aab5cb;
      --line: rgba(255,255,255,.14);
    }
    * { box-sizing: border-box; }
    html { min-height: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 28px;
      overflow: hidden;
      color: var(--text);
      background:
        radial-gradient(ellipse at 15% 15%, rgba(110, 66, 255, .28), transparent 38%),
        radial-gradient(ellipse at 85% 80%, rgba(0, 214, 201, .19), transparent 35%),
        linear-gradient(135deg, #090d1b 0%, #10152b 52%, #101d2a 100%);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    body::before, body::after {
      content: "";
      position: fixed;
      width: 360px;
      height: 360px;
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 50%;
      pointer-events: none;
      animation: drift 14s ease-in-out infinite alternate;
    }
    body::before { top: -180px; right: -100px; }
    body::after { bottom: -230px; left: -100px; width: 480px; height: 480px; animation-delay: -5s; }
    .glow {
      position: fixed;
      width: 220px;
      height: 220px;
      border-radius: 50%;
      background: #7c3aed;
      filter: blur(100px);
      opacity: .23;
      top: 10%;
      left: 10%;
      animation: pulse 6s ease-in-out infinite alternate;
      pointer-events: none;
    }
    main {
      position: relative;
      width: min(100%, 760px);
      text-align: center;
      padding: clamp(30px, 7vw, 68px) clamp(22px, 6vw, 60px);
      border: 1px solid var(--line);
      border-radius: 30px;
      background: linear-gradient(145deg, rgba(255,255,255,.09), rgba(255,255,255,.035));
      box-shadow: 0 30px 100px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.08);
      backdrop-filter: blur(18px);
      animation: rise .8s cubic-bezier(.2,.8,.2,1) both;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 9px 14px;
      border: 1px solid rgba(94, 234, 212, .3);
      border-radius: 999px;
      background: rgba(20, 184, 166, .09);
      color: #99f6e4;
      font-size: 12px;
      font-weight: 750;
      letter-spacing: .15em;
      text-transform: uppercase;
    }
    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #5eead4;
      box-shadow: 0 0 14px #5eead4;
      animation: blink 1.8s ease-in-out infinite;
    }
    .symbol {
      display: grid;
      place-items: center;
      width: 88px;
      height: 88px;
      margin: 30px auto 24px;
      border-radius: 25px;
      border: 1px solid rgba(255,255,255,.17);
      background: linear-gradient(135deg, rgba(139,92,246,.34), rgba(45,212,191,.18));
      box-shadow: 0 15px 45px rgba(124,58,237,.2);
      font-size: 42px;
      animation: float 4s ease-in-out infinite;
    }
    h1 {
      max-width: 620px;
      margin: 0 auto;
      font-size: clamp(2.5rem, 7vw, 5rem);
      line-height: .99;
      letter-spacing: -.065em;
      font-weight: 850;
    }
    h1 span {
      display: block;
      padding-bottom: .1em;
      color: transparent;
      background: linear-gradient(100deg, #c4b5fd 5%, #67e8f9 55%, #a7f3d0 100%);
      -webkit-background-clip: text;
      background-clip: text;
    }
    .description {
      max-width: 480px;
      margin: 23px auto 0;
      color: var(--muted);
      font-size: clamp(15px, 2vw, 18px);
      line-height: 1.75;
    }
    .progress {
      width: min(100%, 360px);
      margin: 34px auto 0;
      text-align: left;
    }
    .progress-label {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 10px;
      color: #d5dced;
      font-size: 12px;
      font-weight: 650;
      letter-spacing: .04em;
    }
    .track {
      height: 6px;
      overflow: hidden;
      border-radius: 99px;
      background: rgba(255,255,255,.1);
    }
    .bar {
      width: 68%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #8b5cf6, #22d3ee, #5eead4);
      box-shadow: 0 0 18px rgba(34,211,238,.35);
      animation: load 1.5s .3s ease-out both;
    }
    .footer {
      margin-top: 38px;
      color: #7f8ba4;
      font-size: 12px;
      letter-spacing: .04em;
    }
    .sparkle { color: #c4b5fd; }
    @keyframes rise { from { opacity: 0; transform: translateY(18px) scale(.985); } to { opacity: 1; transform: translateY(0) scale(1); } }
    @keyframes float { 0%,100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-8px) rotate(3deg); } }
    @keyframes pulse { from { transform: scale(.85); opacity: .14; } to { transform: scale(1.18); opacity: .28; } }
    @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
    @keyframes drift { from { transform: translate(0,0); } to { transform: translate(-22px,18px); } }
    @keyframes load { from { width: 0; } to { width: 68%; } }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <div class="glow" aria-hidden="true"></div>
  <main>
    <div class="badge"><span class="dot"></span> Work in progress</div>
    <div class="symbol" aria-hidden="true">✦</div>
    <h1>Something good <span>is coming.</span></h1>
    <p class="description">
      We’re putting the finishing touches on something special.
      Our new experience is being built right now — check back soon.
    </p>
    <div class="progress" aria-label="Project status">
      <div class="progress-label"><span>Building something great</span><span>In progress</span></div>
      <div class="track"><div class="bar"></div></div>
    </div>
    <div class="footer"><span class="sparkle">✧</span> Made with care · Launching soon <span class="sparkle">✧</span></div>
  </main>
</body>
</html>
